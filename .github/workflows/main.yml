name: Build OpenWrt Package & Release

on:
  workflow_dispatch:
    inputs:
      pkg_repo:
        description: '上游仓库（格式：user/repo）'
        required: true
        default: 'haixing1001/luci-app-singbox-server-claude'
      pkg_branch:
        description: '仓库分支'
        required: true
        default: 'main'
      pkg_name:
        description: '要编译的包名，多个用空格分隔'
        required: true
        default: 'luci-app-singbox-server'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PKG_REPO: ${{ github.event.inputs.pkg_repo }}
  PKG_BRANCH: ${{ github.event.inputs.pkg_branch }}
  PKG_NAME: ${{ github.event.inputs.pkg_name }}

jobs:
  build:
    name: ${{ matrix.arch }} · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - x86_64
        sdk:
          - '25.12'
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Prepare feed directory
        run: |
          git clone --depth=1 -b "$PKG_BRANCH" "https://github.com/${PKG_REPO}.git" /tmp/pkg_src
          FEED_DIR="${GITHUB_WORKSPACE}/feed"
          mkdir -p "${FEED_DIR}"

          if grep -qE '^\s*PKG_NAME\s*:?=' /tmp/pkg_src/Makefile 2>/dev/null; then
            echo "检测到根目录是单包目录，为每个包名创建子目录..."
            for pkg in $PKG_NAME; do
              mkdir -p "${FEED_DIR}/${pkg}"
              cp -r /tmp/pkg_src/. "${FEED_DIR}/${pkg}/"
            done
          else
            echo "检测到根目录是 feed 目录，直接使用..."
            cp -r /tmp/pkg_src/. "${FEED_DIR}/"
          fi

          echo "FEED_DIR=${FEED_DIR}" >> "$GITHUB_ENV"
          echo "Feed 目录内容："
          find "${FEED_DIR}" -maxdepth 3 -type f | sort

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-${{ matrix.sdk }}
          FEED_DIR: ${{ env.FEED_DIR }}
          FEEDNAME: custom
          PACKAGES: ${{ env.PKG_NAME }}
          NO_REFRESH_CHECK: true
          INDEX: 1
          V: s

      - name: Collect packages
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p dist/release dist/feed

          for f in bin/packages/"${ARCH}"/custom/*.{ipk,apk}; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in Packages*|APKINDEX*) continue ;; esac
            base="$(basename "$f")"
            safe="${base//\~/.}"
            cp -v "$f" "dist/release/${safe}"
            cp -v "$f" "dist/feed/${safe}"
          done

          for f in bin/packages/"${ARCH}"/custom/Packages* bin/packages/"${ARCH}"/custom/APKINDEX*; do
            [ -f "$f" ] || continue
            cp -v "$f" dist/feed/
          done

          ls -lh dist/release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: packages-*

      - name: Flatten release files
        run: |
          mkdir -p dist
          find all-artifacts -path '*/release/*' -type f -exec cp -v {} dist/ \;
          ls -lh dist/ || true

      - name: Determine tag
        id: meta
        run: |
          FIRST_PKG=$(echo "$PKG_NAME" | awk '{print $1}')
          DATETIME=$(date +%Y.%m.%d.%H%M)
          echo "tag=${FIRST_PKG}-${DATETIME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          {
            echo "## OpenWrt packages"
            echo ""
            echo "| 包文件 |"
            echo "| :--- |"
            for f in dist/*; do
              [ -f "$f" ] || continue
              echo "| [$(basename "$f")](${BASE}/$(basename "$f")) |"
            done
            echo ""
            echo "> 包名：\`${PKG_NAME}\` · 源码：[${PKG_REPO}](https://github.com/${PKG_REPO}) · 分支 \`${PKG_BRANCH}\`"
          } > release_notes.md
          cat release_notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
